<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>qr story</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500&family=Source+Sans+3:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,900&display=block" rel="stylesheet">
<style>
  :root { --bg:#f0efee; --ink:#252321; --mute:#5e5e5e; --lime:#c1ff24; --lime-ink:#232912; --mint:#24ffcf; --mint-d:#2ad0aa; --lav:#e8d2ff; --line:#c6c6c6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: "Source Sans 3", sans-serif; -webkit-font-smoothing: antialiased; }
  /* Instagram UI covers ~250px top and bottom: keep content in between */
  .frame { position: absolute; inset: 380px 96px 270px; display: flex; flex-direction: column; }
  .logo { position: absolute; top: 255px; left: 96px; font-family: "Source Serif 4", serif; font-weight: 900; font-size: 64px; }
  .pager { position: absolute; top: 280px; right: 96px; font-family: "Source Code Pro", monospace; font-size: 28px; color: var(--mute); }
  .kicker { font-size: 34px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; margin-bottom: 36px; }
  h1 { font-weight: 800; font-size: 128px; line-height: 1.08; letter-spacing: -0.035em; }
  h2 { font-weight: 800; font-size: 96px; line-height: 1.1; letter-spacing: -0.03em; }
  .sub { font-size: 46px; line-height: 1.3; color: var(--mute); margin-top: 44px; max-width: 860px; }
  .hl, .mint { padding: 0 .08em; border-radius: .1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hl { background: linear-gradient(transparent 14%, var(--lime) 14%, var(--lime) 94%, transparent 94%); color: var(--lime-ink); }
  .mint { background: linear-gradient(transparent 14%, var(--mint) 14%, var(--mint) 94%, transparent 94%); }
  .url { font-family: "Source Code Pro", monospace; font-weight: 500; background: var(--mint); padding: 6px 18px; border-radius: 14px; font-size: 44px; display: inline-block; }
  .spacer { flex: 1; }
  .card { background: #f7f7f6; border: 2px solid var(--line); border-radius: 36px; padding: 44px 48px; }
  .qr { background: #fff; border-radius: 40px; padding: 36px; border: 2px solid var(--line); }
  .qr img { display: block; width: 100%; }
  .steps { display: flex; flex-direction: column; gap: 30px; margin-top: 64px; }
  .step { display: flex; gap: 36px; align-items: center; background: #f7f7f6; border: 2px solid var(--line); border-radius: 32px; padding: 38px 44px; }
  .step .n { flex: none; width: 104px; height: 104px; border-radius: 52px; background: var(--lime); color: var(--lime-ink); font-weight: 800; font-size: 56px; display: grid; place-items: center; }
  .step b { display: block; font-size: 52px; font-weight: 700; letter-spacing: -.01em; }
  .step span { font-size: 36px; color: var(--mute); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 52px; }
  .tile { background: #f7f7f6; border: 2px solid var(--line); border-radius: 30px; padding: 34px 38px; }
  .tile .l { font-size: 26px; letter-spacing: .08em; text-transform: uppercase; color: #919191; font-weight: 600; }
  .tile .v { font-size: 92px; font-weight: 600; line-height: 1.05; margin-top: 8px; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 180px; margin-top: 26px; }
  .bars i { flex: 1; background: var(--mint-d); border-radius: 6px 6px 0 0; }
  .pill { display: inline-flex; gap: 16px; align-items: center; background: var(--ink); color: #fff; border-radius: 60px; padding: 20px 38px; font-size: 36px; font-weight: 600; }
  .pill.lime { background: var(--lime); color: var(--lime-ink); }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .arrow { font-size: 120px; line-height: 1; }
  .rot { transform: rotate(-4deg); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const s = +(P.get('s') || 1), lang = P.get('lang') || 'de';
const T = {
  de: {
    1: `<div class="kicker">Neu · gratis</div>
        <h1>QR-Codes, die du <span class="hl">später ändern</span> kannst.</h1>
        <p class="sub">Gedruckt ist gedruckt? Nicht mehr. Ich hab ein kleines Tool gebaut. 👇</p>
        <div class="spacer"></div>
        <div class="row" style="justify-content:space-between;align-items:flex-end">
          <div class="qr rot" style="width:520px"><img src="qr-landing.svg"></div>
          <div class="arrow">→</div>
        </div>`,
    2: `<div class="kicker">So geht's</div>
        <h2>In 10 Sekunden zum QR-Code.</h2>
        <div class="steps">
          <div class="step"><div class="n">1</div><div><b>Link einfügen</b><span>Website, Insta, Ticketshop …</span></div></div>
          <div class="step"><div class="n">2</div><div><b>QR-Code holen</b><span>als PNG oder SVG, druckfertig</span></div></div>
          <div class="step"><div class="n">3</div><div><b>Ziel jederzeit ändern</b><span>der gedruckte Code bleibt gleich</span></div></div>
        </div>
        <div class="spacer"></div>
        <div class="row"><span class="pill lime">Ohne Anmeldung</span><span class="pill">Gratis</span></div>`,
    3: `<div class="kicker">Statistik inklusive</div>
        <h2>Sieh, wer scannt.<br><span class="mint">Ohne Tracking-Cookies.</span></h2>
        <div class="tiles">
          <div class="tile"><div class="l">Scans</div><div class="v">312</div></div>
          <div class="tile"><div class="l">Besucher</div><div class="v">248</div></div>
          <div class="tile" style="grid-column:span 2"><div class="l">Letzte 30 Tage</div><div class="bars" id="bars"></div></div>
          <div class="tile"><div class="l">Top-Ort</div><div class="v" style="font-size:64px">Wien</div></div>
          <div class="tile"><div class="l">Mobil</div><div class="v">91%</div></div>
        </div>
        <div class="spacer"></div>
        <p class="sub" style="margin:0 0 6px;font-size:28px;color:#919191">Beispielwerte</p>
        <p class="sub" style="margin:0;font-size:38px">Keine IP-Adressen gespeichert. Datenschutzfreundlich gebaut.</p>`,
    4: `<div class="kicker">Probier's aus</div>
        <h2>Mach deinen eigenen QR-Code.</h2>
        <div class="spacer"></div>
        <div class="qr" style="width:620px;align-self:center"><img src="qr-landing.svg"></div>
        <div style="text-align:center;margin-top:44px"><span class="url">qr.viennastruggle.at</span></div>
        <div class="spacer"></div>
        <div class="row" style="justify-content:center"><span class="pill lime">Gratis</span><span class="pill">Ohne Anmeldung</span><span class="pill">Mit Statistik</span></div>`,
  },
  en: {
    1: `<div class="kicker">New · free</div>
        <h1>QR codes you can <span class="hl">change later.</span></h1>
        <p class="sub">Printed means final? Not anymore. I built a little tool. 👇</p>
        <div class="spacer"></div>
        <div class="row" style="justify-content:space-between;align-items:flex-end">
          <div class="qr rot" style="width:520px"><img src="qr-landing.svg"></div>
          <div class="arrow">→</div>
        </div>`,
    2: `<div class="kicker">How it works</div>
        <h2>A QR code in 10 seconds.</h2>
        <div class="steps">
          <div class="step"><div class="n">1</div><div><b>Paste a link</b><span>website, Insta, ticket shop …</span></div></div>
          <div class="step"><div class="n">2</div><div><b>Get your QR code</b><span>PNG or SVG, ready to print</span></div></div>
          <div class="step"><div class="n">3</div><div><b>Change the target anytime</b><span>the printed code stays the same</span></div></div>
        </div>
        <div class="spacer"></div>
        <div class="row"><span class="pill lime">No sign-up</span><span class="pill">Free</span></div>`,
    3: `<div class="kicker">Stats included</div>
        <h2>See who scans.<br><span class="mint">No tracking cookies.</span></h2>
        <div class="tiles">
          <div class="tile"><div class="l">Scans</div><div class="v">312</div></div>
          <div class="tile"><div class="l">Visitors</div><div class="v">248</div></div>
          <div class="tile" style="grid-column:span 2"><div class="l">Last 30 days</div><div class="bars" id="bars"></div></div>
          <div class="tile"><div class="l">Top city</div><div class="v" style="font-size:64px">Vienna</div></div>
          <div class="tile"><div class="l">Mobile</div><div class="v">91%</div></div>
        </div>
        <div class="spacer"></div>
        <p class="sub" style="margin:0 0 6px;font-size:28px;color:#919191">Example values</p>
        <p class="sub" style="margin:0;font-size:38px">No IP addresses stored. Built privacy-first.</p>`,
    4: `<div class="kicker">Try it</div>
        <h2>Make your own QR code.</h2>
        <div class="spacer"></div>
        <div class="qr" style="width:620px;align-self:center"><img src="qr-landing.svg"></div>
        <div style="text-align:center;margin-top:44px"><span class="url">qr.viennastruggle.at</span></div>
        <div class="spacer"></div>
        <div class="row" style="justify-content:center"><span class="pill lime">Free</span><span class="pill">No sign-up</span><span class="pill">With stats</span></div>`,
  },
};
document.getElementById('root').innerHTML =
  `<div class="logo">qr</div><div class="pager">${s}/4</div><div class="frame">${T[lang][s]}</div>`;
const bars = document.getElementById('bars');
if (bars) { const h=[12,18,9,22,30,26,14,8,20,35,41,28,19,24,33,47,52,38,29,31,44,58,62,49,40,55,70,64,81,76];
  bars.innerHTML = h.map(v=>`<i style="height:${v/81*100}%"></i>`).join(''); }
</script>
</body>
</html>
