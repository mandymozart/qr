<!doctype html><meta charset="utf-8"><title>Artful QR research</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:"Source Sans 3",sans-serif;background:#fffdf5;margin:24px}h1{font-family:"Permanent Marker"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
figure{margin:0;border:4px solid #111;border-radius:18px;padding:14px;background:#fff;box-shadow:5px 5px 0 #111}
figure img{width:100%;display:block}figcaption{font-size:14px;margin-top:10px}.ok{color:#00a050}.bad{color:#e01010}</style>
<h1>Artful QR styles (research)</h1><p>Every code points to the same link. Decode results come from test.sh.</p><div class="grid"><figure data-id="classic"><img src="classic.svg" alt=""><figcaption><b>Classic</b> <span class="res"></span><br>Square modules, black. Baseline.</figcaption></figure><figure data-id="dots"><img src="dots.svg" alt=""><figcaption><b>Dots</b> <span class="res"></span><br>Round data dots, square eyes kept for reliable detection.</figcaption></figure><figure data-id="pop"><img src="pop.svg" alt=""><figcaption><b>Pop colors</b> <span class="res"></span><br>Red eyes, blue data, black timing. Dark colors on white keep contrast.</figcaption></figure><figure data-id="gradient"><img src="gradient.svg" alt=""><figcaption><b>Gradient</b> <span class="res"></span><br>Data modules filled with a diagonal gradient (purple → pink). Keep both ends dark enough.</figcaption></figure><figure data-id="logo"><img src="logo.svg" alt=""><figcaption><b>Logo in the middle</b> <span class="res"></span><br>Highest error correction (H, 30%) and a cleared space for a logo of ~20% width.</figcaption></figure><figure data-id="inverted"><img src="inverted.svg" alt=""><figcaption><b>Inverted (light on dark)</b> <span class="res"></span><br>Yellow modules on black. Looks great, but some older scanner apps cannot read inverted codes.</figcaption></figure></div>
<script>fetch("results.json").then(r=>r.json()).then(j=>{for(const[k,v]of Object.entries(j)){const s=document.querySelector(`[data-id="${k}"] .res`);if(s){s.textContent=v?"✓ scans":"✕ failed";s.className="res "+(v?"ok":"bad")}}}).catch(()=>{})</script>
